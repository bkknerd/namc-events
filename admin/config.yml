# NAMC Wisconsin conference site: content manager (Decap CMS)
# Repository the content is saved to (owner/name). Branch must match your default branch.
backend:
  name: github
  repo: bkknerd/namc-events
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth

logo_url: /img/img-ce186583.webp
site_url: https://namc-events.netlify.app
display_url: https://namc-events.netlify.app
media_folder: img
public_folder: /img
locale: en

collections:
  - name: homepage
    label: Home page
    files:
      - name: home
        label: Home page text and photos
        file: content/home.json
        fields:
          - label: Top banner
            name: hero
            widget: object
            collapsed: false
            fields:
              - {label: "Small line above the title", name: kicker, widget: string}
              - {label: "Big title (one line per row)", name: title_lines, widget: list, label_singular: line, field: {label: Line, name: line, widget: string}, hint: "Shown stacked. Keep it to 3 short lines."}
              - {label: "Theme label", name: theme_label, widget: string}
              - {label: "Theme title", name: theme_title, widget: string}
              - {label: "Theme line 1", name: theme_line_1, widget: string}
              - {label: "Theme line 2", name: theme_line_2, widget: string}
          - label: 'Side box: "What are you here to do?"'
            name: side
            widget: object
            collapsed: true
            fields:
              - {label: "Small tag", name: badge, widget: string}
              - {label: Heading, name: heading, widget: string}
              - label: "The three cards (Attend, Sponsor, Exhibit)"
                name: paths
                widget: list
                label_singular: card
                min: 3
                max: 3
                summary: "{{fields.name}}"
                hint: "Keep exactly three. The Attend card shows the Early Bird price automatically, so its small print is not used."
                fields:
                  - {label: Card name, name: name, widget: string}
                  - {label: "One-line description", name: desc, widget: string}
                  - {label: "Small print (can use prices like {{tmin}} and {{tk.bo}})", name: detail, widget: string, required: false}
          - {label: "Caption under the hotel photo", name: hotel_caption, widget: string}
          - {label: "Caption under the skyline photo", name: skyline_caption, widget: string}
          - label: 'Section: "Why Milwaukee?"'
            name: why_milwaukee
            widget: object
            collapsed: true
            fields:
              - {label: "Small label", name: label, widget: string}
              - {label: "Big heading (one line per row)", name: heading_lines, widget: list, label_singular: line, field: {label: Line, name: line, widget: string}}
              - label: Reasons
                name: items
                widget: list
                label_singular: reason
                summary: "{{fields.title}}"
                hint: "Four reasons fit the layout best."
                fields:
                  - {label: Title, name: title, widget: string}
                  - {label: Text, name: text, widget: text}
          - label: Night skyline photo text
            name: welcome
            widget: object
            collapsed: true
            fields:
              - {label: "Small label", name: label, widget: string}
              - {label: "Big heading (one line per row)", name: heading_lines, widget: list, label_singular: line, field: {label: Line, name: line, widget: string}}
          - {label: "Label above the keynote speaker card", name: keynote_label, widget: string, hint: "The speaker's name, title and photo are edited under Speakers."}
          - label: '"Milwaukee by the numbers"'
            name: numbers
            widget: object
            collapsed: true
            fields:
              - {label: Section label, name: label, widget: string}
              - label: Numbers
                name: items
                widget: list
                label_singular: number
                summary: "{{fields.value}} {{fields.label}}"
                fields:
                  - {label: "The number (for example 73 or $100+ Billion)", name: value, widget: string}
                  - {label: "What it describes", name: label, widget: string}
          - label: '"Why partner with NAMC"'
            name: why_partner
            widget: object
            collapsed: true
            fields:
              - {label: Heading, name: heading, widget: string}
              - {label: "Paragraph under the heading", name: intro, widget: text}
              - label: Benefit cards
                name: cards
                widget: list
                label_singular: card
                summary: "{{fields.title}}"
                hint: "Four cards fit the layout best."
                fields:
                  - {label: Title, name: title, widget: string}
                  - {label: Text, name: text, widget: text}
          - label: Quote
            name: quote
            widget: object
            collapsed: true
            fields:
              - {label: "The quote (include the quotation marks)", name: text, widget: text}
              - {label: "Who said it", name: attribution, widget: string}
          - label: "2026 forum banner"
            name: forum
            widget: object
            collapsed: true
            fields:
              - {label: Small label, name: label, widget: string}
              - {label: Headline, name: heading, widget: string}
              - {label: "Button text", name: button, widget: string}
          - label: 'Bottom section: "Lead with impact"'
            name: cta
            widget: object
            collapsed: true
            fields:
              - {label: Small label, name: label, widget: string}
              - {label: "Big heading (one line per row)", name: heading_lines, widget: list, label_singular: line, field: {label: Line, name: line, widget: string}}
          - label: Photos
            name: images
            widget: object
            collapsed: true
            hint: "Each photo has a description for people who use screen readers. Please keep both up to date."
            fields:
              - {label: "Top banner illustration", name: hero_illustration, widget: image}
              - {label: "Description of that illustration", name: hero_illustration_alt, widget: string}
              - {label: "Pfister Hotel photo", name: hotel, widget: image}
              - {label: "Description of the hotel photo", name: hotel_alt, widget: string}
              - {label: "Skyline photo (daytime)", name: skyline_day, widget: image}
              - {label: "Description of the daytime skyline", name: skyline_day_alt, widget: string}
              - {label: "Skyline photo (night)", name: skyline_night, widget: image}
              - {label: "Description of the night skyline", name: skyline_night_alt, widget: string}
              - {label: "Skyline photo (dusk)", name: skyline_dusk, widget: image}
              - {label: "Description of the dusk skyline", name: skyline_dusk_alt, widget: string}

  - name: registration
    label: Registration and prices
    files:
      - name: tickets
        label: Tickets, gala and booth prices
        file: content/tickets.json
        fields:
          - label: Items
            name: tickets
            widget: list
            label_singular: item
            summary: "{{fields.name}}"
            hint: "Change a price here and it updates everywhere on the site."
            fields:
              - {label: "Code (do not change on existing items)", name: id, widget: string, pattern: ['^[a-z0-9]+$', 'Use lowercase letters and numbers only'], hint: "A short code the site uses behind the scenes. Existing items use: eb, std, gt, gk, bo."}
              - {label: Name, name: name, widget: string}
              - {label: "Price in US dollars", name: price, widget: number, value_type: int, min: 0, hint: "Numbers only. Do not type the $ sign."}
              - {label: "What is included", name: includes, widget: text}
              - {label: "Sales start", name: opens, widget: datetime, required: false, hint: "Leave empty for items that are not sold in a time window, like the Gala table."}
              - {label: "Sales end", name: closes, widget: datetime, required: false}
              - {label: "Date label shown on the card", name: label, widget: string, hint: "For example: Jan 1 – Apr 30, 2027"}
      - name: pricing
        label: Hotel rate and program ad rates
        file: content/pricing.json
        fields:
          - {label: "Hotel rate per night", name: hotel_rate, widget: string, hint: "Numbers only, for example 239.00"}
          - {label: "Payment page address (from National)", name: payment_url, widget: string, required: false, hint: "Leave empty until National provides it. While empty, the site does not link to any payment page and the Register page keeps collecting sign-ups only. Must start with https://"}
          - label: "Program ad rates"
            name: ads
            widget: list
            label_singular: ad
            summary: "{{fields.name}}"
            fields:
              - {label: "Ad name", name: name, widget: string}
              - {label: Size, name: size, widget: string}
              - {label: "Price", name: price, widget: string, hint: "Include the $ sign, for example $3,000"}

  - name: sponsorship
    label: Sponsorship levels
    files:
      - name: sponsors
        label: Sponsor and exhibitor levels
        file: content/sponsors.json
        fields:
          - label: Levels
            name: tiers
            widget: list
            label_singular: level
            summary: "{{fields.name}}"
            fields:
              - {label: "Code (do not change on existing levels)", name: id, widget: string, pattern: ['^[a-z0-9]+$', 'Use lowercase letters and numbers only'], hint: "Existing levels use: presenting, platinum, silver, bronze, copper, gov, booth."}
              - {label: Name, name: name, widget: string}
              - {label: "Price in US dollars", name: price, widget: number, value_type: int, min: 0, hint: "Numbers only. Do not type the $ sign."}
              - {label: Type, name: kind, widget: select, options: [Sponsor, Exhibitor]}
              - {label: "Short summary shown on the card", name: highlight, widget: string}
              - label: "What the level includes"
                name: benefits
                widget: list
                label_singular: benefit
                field: {label: Benefit, name: benefit, widget: text}

  - name: people
    label: Speakers
    files:
      - name: speakers
        label: Keynote and featured speakers
        file: content/speakers.json
        fields:
          - label: "Keynote speaker"
            name: keynote
            widget: object
            collapsed: false
            fields:
              - {label: Name, name: name, widget: string}
              - {label: "Title and company (shown on the keynote card and FAQ)", name: title, widget: string}
              - {label: "Company, long version", name: org, widget: string}
              - {label: "Company, short version (shown in the bio panel)", name: short_org, widget: string}
              - {label: Photo, name: photo, widget: image, hint: "A square or portrait photo, about 800 pixels wide."}
              - label: "Bio, one paragraph per box"
                name: bio
                widget: list
                label_singular: paragraph
                field: {label: Paragraph, name: paragraph, widget: text}
          - label: "Featured speakers"
            name: featured
            widget: list
            label_singular: speaker
            summary: "{{fields.name}}"
            fields:
              - {label: Name, name: name, widget: string}
              - {label: Photo, name: photo, widget: image}
              - {label: "LinkedIn profile address (optional)", name: linkedin_url, widget: string, required: false}
              - {label: "LinkedIn search words (used when there is no profile address)", name: linkedin_search, widget: string, required: false}
              - {label: "Website address (optional)", name: web_url, widget: string, required: false}
              - {label: "Website link text", name: web_label, widget: string, required: false}
              - {label: "Title (shown under the name)", name: title, widget: string, required: false}
              - {label: "Short bio", name: bio, widget: text, required: false}

  - name: logos
    label: Partners and sponsor tower
    files:
      - name: partners
        label: Partners, sponsors and open floors
        file: content/partners.json
        fields:
          - {label: "Partners list title (not shown at the moment)", name: top_title, widget: string}
          - {label: "Partners link text (not shown at the moment)", name: top_link_label, widget: string}
          - label: "Partners (listed under Built on) and top-level open slots"
            name: top
            widget: list
            label_singular: logo
            summary: "{{fields.name}}"
            fields: &partner
              - {label: Name, name: name, widget: string}
              - {label: "Small text under the name", name: caption, widget: string, hint: "To show a level price, type {{p.presenting}}, {{p.platinum}}, {{p.silver}} and so on."}
              - {label: Logo, name: logo, widget: image, required: false}
              - {label: "Link when clicked (optional)", name: url, widget: string, required: false, hint: "For example /sponsor?tier=silver or https://example.com"}
              - {label: "This level is still open (shows as an open floor on the tower)", name: open_slot, widget: boolean, default: false}
          - {label: "Sponsor tower label", name: regular_title, widget: string}
          - {label: "Sponsor tower button text", name: regular_link_label, widget: string}
          - label: "Sponsors (logos under the tower) and open slots"
            name: regular
            widget: list
            label_singular: logo
            summary: "{{fields.name}}"
            fields: *partner

  - name: pagecontent
    label: Program, FAQ and history
    files:
      - name: program
        label: Program highlights
        file: content/program.json
        fields:
          - label: Highlights
            name: items
            widget: list
            label_singular: highlight
            summary: "{{fields.title}}"
            fields:
              - {label: Title, name: title, widget: string}
              - {label: "One-line summary", name: summary, widget: string}
              - {label: Details, name: detail, widget: text}
              - {label: "Button goes to", name: page, widget: select, options: [register, speakers, exhibit, sponsor, information, schedule, directions, history, contact, advertise]}
              - {label: "Button text", name: link_label, widget: string}
              - {label: "Who it is for", name: audience, widget: select, multiple: true, options: [Attendees, Sponsors, Exhibitors]}
      - name: faq
        label: Frequently asked questions
        file: content/faq.json
        fields:
          - label: Questions
            name: items
            widget: list
            label_singular: question
            summary: "{{fields.question}}"
            fields:
              - {label: Question, name: question, widget: string}
              - {label: Answer, name: answer, widget: text, hint: "To show a live price or date, type a code in curly brackets, like {{tk.eb}} for the Early Bird price. Click How to edit for the list."}
      - name: history
        label: NAMC history and numbers
        file: content/history.json
        fields:
          - label: Timeline
            name: timeline
            widget: list
            label_singular: event
            summary: "{{fields.year}} {{fields.title}}"
            fields:
              - {label: Year, name: year, widget: string}
              - {label: Title, name: title, widget: string}
              - {label: Text, name: text, widget: text}
              - {label: "Is it national or Wisconsin?", name: scope, widget: select, options: [National, Wisconsin]}
          - label: "Numbers"
            name: numbers
            widget: list
            label_singular: number
            summary: "{{fields.value}} {{fields.label}}"
            fields:
              - {label: Number, name: value, widget: string}
              - {label: "Symbol before it (for example $)", name: prefix, widget: string, required: false}
              - {label: "Letter after it (for example M, B or +)", name: suffix, widget: string, required: false}
              - {label: "Decimal places (0 or 1)", name: decimals, widget: number, value_type: int, min: 0, max: 1}
              - {label: "What it describes", name: label, widget: string}

  - name: comingsoon
    label: Coming soon page
    files:
      - name: coming-soon
        label: Coming soon switch and text
        file: content/coming-soon.json
        fields:
          - {label: "Show the coming soon page to visitors", name: enabled, widget: boolean, default: false, hint: "Turn on to hide the whole site behind the coming soon page. Turn off to show the full site. Changes go live about a minute after you publish."}
          - {label: "Preview key", name: preview_key, widget: string, hint: "While the coming soon page is on, open namc-events.netlify.app/?preview=THIS-KEY to see the full site. Open /?preview=off to leave preview."}
          - {label: "Browser tab title", name: seo_title, widget: string}
          - {label: "Small line above the title", name: kicker, widget: string}
          - {label: "Big title (one line per row)", name: title_lines, widget: list, field: {label: Line, name: line, widget: string}}
          - {label: "Message", name: message, widget: text, required: false}
          - {label: "Date and place line", name: date_line, widget: string, required: false}
          - {label: "Show the City Hall drawing", name: show_drawing, widget: boolean, default: true}
          - {label: "Background photo (optional)", name: background, widget: image, required: false}
          - {label: "Description of the background photo", name: background_alt, widget: string, required: false}
          - {label: "Show the email sign-up box", name: show_notify, widget: boolean, default: true}
          - {label: "Sign-up heading", name: notify_heading, widget: string, required: false}
          - {label: "Sign-up text", name: notify_text, widget: text, required: false}
          - {label: "Email box label", name: email_label, widget: string, required: false}
          - {label: "Interest dropdown label", name: interest_label, widget: string, required: false}
          - {label: "Interest choices", name: interests, widget: list, field: {label: Choice, name: choice, widget: string}}
          - {label: "Button text", name: notify_button, widget: string, required: false}
          - {label: "Thank-you message after sign-up", name: notify_success, widget: string, required: false}
          - {label: "Show the contact strip", name: show_contact, widget: boolean, default: true}
          - {label: "Contact strip heading", name: contact_heading, widget: string, required: false}
          - {label: "Contact strip text", name: contact_text, widget: text, required: false, hint: "Links are kept as written, for example <a href=\"tel:+14143057360\">(414) 305-7360</a>."}

  - name: pagetext
    label: Page text (every page)
    files:
      - name: copy
        label: All page text, by page
        file: content/copy.json
        description: "Every heading, paragraph, button and label on the site. Open a page's section and change the words. Leave a box empty to use the original text. Codes in curly brackets like {{tk.eb}} fill in live prices and dates."
        fields:
          - label: "Site-wide: top bar, menu, footer, page titles"
            name: site
            widget: object
            collapsed: true
            fields:
              - {label: "Keyboard link: skip to content", name: "skip_link", widget: string, required: false}
              - {label: "Phone menu button", name: "menu_button", widget: string, required: false}
              - {label: "Footer: credit line", name: "footer_credit", widget: string, required: false}
              - {label: "Top bar: city", name: "topbar_city", widget: string, required: false}
              - {label: "Top bar: venue and dates", name: "topbar_dates", widget: string, required: false}
              - {label: "Top bar: weather line", name: "topbar_weather", widget: text, required: false, hint: "Keep tags like <br>, <b> and links as they are, or remove them on purpose."}
              - {label: "Top bar: forecast link text", name: "topbar_forecast", widget: string, required: false}
              - {label: "Top bar: forecast link address", name: "topbar_forecast_url", widget: string, required: false}
              - {label: "Header: name next to the logo", name: "header_name", widget: string, required: false}
              - {label: "Header: line under the name", name: "header_tagline", widget: string, required: false}
              - {label: "Header: Register button", name: "header_register", widget: string, required: false}
              - {label: "Footer: event name and dates", name: "footer_lockup", widget: text, required: false, hint: "Keep tags like <br>, <b> and links as they are, or remove them on purpose."}
              - {label: "Footer: about the chapter", name: "footer_about", widget: text, required: false}
              - {label: "Footer: Register button", name: "footer_register", widget: string, required: false}
              - {label: "Footer: first column title", name: "footer_col_conference", widget: string, required: false}
              - {label: "Footer: second column title", name: "footer_col_involved", widget: string, required: false}
              - {label: "Footer: About title", name: "footer_col_about", widget: string, required: false}
              - {label: "Footer: Contact title", name: "footer_col_contact", widget: string, required: false}
              - {label: "Footer: phone number", name: "footer_phone", widget: string, required: false}
              - {label: "Footer: phone link (tel:+1...)", name: "footer_phone_link", widget: string, required: false}
              - {label: "Footer: email", name: "footer_email", widget: string, required: false}
              - {label: "Footer: email link (mailto:...)", name: "footer_email_link", widget: string, required: false}
              - {label: "Footer: contact page link text", name: "footer_contact_page", widget: string, required: false}
              - {label: "Footer: mailing address", name: "footer_address", widget: text, required: false, hint: "Keep tags like <br>, <b> and links as they are, or remove them on purpose."}
              - {label: "Footer: Follow title", name: "footer_col_follow", widget: string, required: false}
              - {label: "Footer: social link 1 text", name: "footer_social_1", widget: string, required: false}
              - {label: "Footer: social link 1 address", name: "footer_social_1_url", widget: string, required: false}
              - {label: "Footer: social link 2 text", name: "footer_social_2", widget: string, required: false}
              - {label: "Footer: social link 2 address", name: "footer_social_2_url", widget: text, required: false}
              - {label: "Footer: social link 3 text", name: "footer_social_3", widget: string, required: false}
              - {label: "Footer: social link 3 address", name: "footer_social_3_url", widget: string, required: false}
              - {label: "Footer: social link 4 text", name: "footer_social_4", widget: string, required: false}
              - {label: "Footer: social link 4 address", name: "footer_social_4_url", widget: string, required: false}
              - {label: "Footer: copyright line (after the year)", name: "footer_copyright", widget: string, required: false}
              - {label: "Phone bar: dates", name: "phonebar_dates", widget: string, required: false}
              - {label: "Phone bar: venue", name: "phonebar_venue", widget: string, required: false}
              - {label: "Phone bar: Register button", name: "phonebar_register", widget: string, required: false}
              - {label: "Page name (menu, footer, browser tab): Home", name: "page_home", widget: string, required: false}
              - {label: "Page name (menu, footer, browser tab): Information", name: "page_information", widget: string, required: false}
              - {label: "Page name (menu, footer, browser tab): Program", name: "page_schedule", widget: string, required: false}
              - {label: "Page name (menu, footer, browser tab): Speakers", name: "page_speakers", widget: string, required: false}
              - {label: "Page name (menu, footer, browser tab): Register", name: "page_register", widget: string, required: false}
              - {label: "Page name (menu, footer, browser tab): Venue", name: "page_directions", widget: string, required: false}
              - {label: "Page name (menu, footer, browser tab): 2026 B2B Forum", name: "page_archive", widget: string, required: false}
              - {label: "Page name (menu, footer, browser tab): Page not found", name: "page_notfound", widget: string, required: false}
              - {label: "Page name (menu, footer, browser tab): History", name: "page_history", widget: string, required: false}
              - {label: "Page name (menu, footer, browser tab): Sponsor", name: "page_sponsor", widget: string, required: false}
              - {label: "Page name (menu, footer, browser tab): Exhibit", name: "page_exhibit", widget: string, required: false}
              - {label: "Page name (menu, footer, browser tab): Advertise", name: "page_advertise", widget: string, required: false}
              - {label: "Page name (menu, footer, browser tab): Contact", name: "page_contact", widget: string, required: false}
              - {label: "Menu: dropdown 1 title", name: "menu_group_1", widget: string, required: false}
              - {label: "Menu: dropdown 2 title", name: "menu_group_2", widget: string, required: false}
              - {label: "Menu: dropdown 3 title", name: "menu_group_3", widget: string, required: false}
              - {label: "Menu: description under information", name: "menu_desc_information", widget: string, required: false}
              - {label: "Menu: description under schedule", name: "menu_desc_schedule", widget: string, required: false}
              - {label: "Menu: description under speakers", name: "menu_desc_speakers", widget: string, required: false}
              - {label: "Menu: description under directions", name: "menu_desc_directions", widget: string, required: false}
              - {label: "Menu: description under sponsor", name: "menu_desc_sponsor", widget: string, required: false}
              - {label: "Menu: description under exhibit", name: "menu_desc_exhibit", widget: string, required: false}
              - {label: "Menu: description under advertise", name: "menu_desc_advertise", widget: string, required: false}
              - {label: "Menu: description under history", name: "menu_desc_history", widget: string, required: false}
              - {label: "Menu: description under archive", name: "menu_desc_archive", widget: string, required: false}
              - {label: "Search and share description: speakers page", name: "seo_speakers", widget: text, required: false}
              - {label: "Search and share description: notfound page", name: "seo_notfound", widget: string, required: false}
              - {label: "Search and share description: archive page", name: "seo_archive", widget: text, required: false}
              - {label: "Search and share description: home page", name: "seo_home", widget: text, required: false}
              - {label: "Search and share description: information page", name: "seo_information", widget: text, required: false}
              - {label: "Search and share description: schedule page", name: "seo_schedule", widget: text, required: false}
              - {label: "Text: (prefers-reduced-motion: reduce)", name: "prefers_reduced_motion_reduce", widget: string, required: false}
              - {label: "Text: Coming soon", name: "coming_soon", widget: string, required: false}
              - {label: "Text: | NAMC National Conference 2027", name: "namc_national_conference_2027", widget: string, required: false}
              - {label: "Text: 58th Annual NAMC National Conference | Milwaukee, June 28–30, 2027", name: "58th_annual_namc_national_conference", widget: string, required: false}
              - {label: "Small label: 2027 keynote speaker", name: "2027_keynote_speaker", widget: string, required: false}
              - {label: "Text: Register", name: "register", widget: string, required: false}
